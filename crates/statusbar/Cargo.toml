[package]
name = "statusbar"
version = "0.1.0"
edition = "2021"

[dependencies]
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-common.workspace = true
